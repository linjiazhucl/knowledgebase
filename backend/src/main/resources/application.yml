server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: enterprise-ai-kb-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/enterprise_ai_kb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 30000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  session-ttl-hours: ${APP_SESSION_TTL_HOURS:8}
  qa-history-limit: ${APP_QA_HISTORY_LIMIT:6}
  milvus:
    url: ${MILVUS_URL:http://localhost:19091}
    collection: ${MILVUS_COLLECTION:enterprise_kb_segments}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:kb-documents}
